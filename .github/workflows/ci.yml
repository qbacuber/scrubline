name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wersja pnpm z pola packageManager w package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Typecheck registry (strict)
        run: pnpm typecheck:registry

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate registry
        run: pnpm exec shadcn registry validate

      - name: Build registry
        run: pnpm exec shadcn build

      - name: Build site
        run: pnpm build
